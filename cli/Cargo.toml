[package]
name = "axo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for Axo Framework: init, dev (hot-reload), build, and release commands"
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["ui", "gui", "cli", "hot-reload", "typescript"]
categories = ["gui", "command-line-utilities", "wasm"]

[[bin]]
name = "axo"
path = "src/bin/axo.rs"

[[bin]]
name = "axo-cli"
path = "src/main.rs"

[dependencies]
axo-core = { path = "../core", version = "0.1" }
axo-bridge = { path = "../bridge", version = "0.1" }
axo-platforms = { path = "../platforms", version = "0.1" }
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
qrcode = { version = "0.14", optional = true }
image = { version = "0.25", optional = true }
local-ip-address = { version = "0.6", optional = true }

[features]
default = ["qr"]
qr = ["qrcode", "image", "local-ip-address"]
