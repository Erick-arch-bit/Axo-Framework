[workspace]
resolver = "2"
members = [
    "bridge",
    "core",
    "cli",
    "platforms",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Axo Framework"
repository = "https://github.com/Erick-arch-bit/Axo-Framework"
homepage = "https://github.com/Erick-arch-bit/Axo-Framework"
readme = "README.md"

[workspace.dependencies]
wgpu = "22"
winit = "0.30"
taffy = "0.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
rquickjs = { version = "0.9", features = ["array-buffer", "classes", "properties", "parallel"] }
