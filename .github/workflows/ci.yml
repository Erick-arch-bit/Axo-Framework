name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Check advisories
        run: cargo audit --deny warnings --config audit.toml

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: lint-${{ runner.os }}-cargo-

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-cargo-

      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose
