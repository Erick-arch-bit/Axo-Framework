[package]
name = "axo-platforms"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform backends for Axo Framework: desktop (winit), Android (JNI), iOS (UIKit), Web (WASM)"
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["ui", "gui", "cross-platform", "android", "wasm"]
categories = ["gui", "game-engines", "wasm"]

[dependencies]
axo-core = { path = "../core", version = "0.1" }
axo-bridge = { path = "../bridge", version = "0.1" }
wgpu.workspace = true
winit.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
